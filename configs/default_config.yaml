# Default Experiment Configuration
# Research Paper: Semi-Supervised Brain Tumor Segmentation Using Medical Foundation Models Under Limited Annotation

project:
  name: "semi-supervised-brain-tumor-segmentation"
  seed: 42
  device: "cuda" # or "cpu"

dataset:
  root_dir: "data/BraTS-Africa"
  cohorts:
    - "95_Glioma"
    - "51_OtherNeoplasms"
  modalities:
    - "t1c"
    - "t1n"
    - "t2f"
    - "t2w"
  num_classes: 4 # 0: Background, 1: NCR, 2: ED, 3: ET
  sub_regions:
    WT: [1, 2, 3] # Whole Tumor
    TC: [1, 3]    # Tumor Core
    ET: [3]       # Enhancing Tumor
  spatial_size: [128, 128, 128] # For 3D volumetric patches
  slice_size: [256, 256]        # For 2D foundation model prompting
  val_ratio: 0.15
  test_ratio: 0.15

semi_supervised:
  labeled_ratios: [0.10, 0.20, 0.50, 1.0] # 10%, 20%, 50%, 100% (oracle)
  active_ratio: 0.10
  strategy: "mean_teacher" # Options: "mean_teacher", "consistency_regularization", "pseudo_labeling"
  ema_decay: 0.99
  consistency_loss: "mse" # or "kl_div"
  consistency_weight: 1.0
  consistency_rampup_epochs: 20
  pseudo_label_threshold: 0.85

foundation_model:
  name: "medsam" # Options: "medsam", "sam_vit_b", "swin_unetr"
  pretrained: true
  freeze_image_encoder: true
  prompt_type: "bounding_box" # or "points", "slice_guidance"

training:
  batch_size: 2
  num_workers: 4
  epochs: 100
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: "AdamW"
  lr_scheduler: "CosineAnnealingLR"
  min_lr: 1.0e-6
  mixed_precision: true

logging:
  save_dir: "runs/experiments"
  log_interval: 10
  save_best_metric: "val_mean_dice"
